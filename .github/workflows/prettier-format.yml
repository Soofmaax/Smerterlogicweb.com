name: Format with Prettier

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 6" # weekly (Saturday) auto-format PR

permissions:
  contents: write
  pull-requests: write

jobs:
  prettier-format:
    name: Run Prettier and open a PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier (write)
        run: npm run format

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: apply prettier formatting"
          title: "chore: apply prettier formatting"
          body: "Automated formatting PR (Prettier)."
          branch: "chore/prettier-format"
          delete-branch: true