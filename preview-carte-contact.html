<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Preview — Carte de contact</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --background: #ffffff;
        --foreground: #111111;
        --card-bg: #ffffff;
        --border: #d4d4d4;
        --primary: #111111;
        --primary-foreground: #ffffff;
        --secondary-border: rgba(0, 0, 0, 0.18);
        --accent: #f3f3f3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #f4f4f4, #ffffff);
        color: var(--foreground);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-wrapper {
        width: 100%;
        max-width: 360px;
        padding: 24px 16px;
      }
      .card-spin {
        opacity: 0;
        transform:
          perspective(1200px)
          translateY(16px)
          rotateX(14deg)
          rotateY(-10deg)
          scale(0.9);
        transform-origin: center;
        transition:
          opacity 480ms ease,
          transform 650ms cubic-bezier(0.19, 1, 0.22, 1);
      }
      .card-spin.in-view {
        opacity: 1;
        transform:
          perspective(1200px)
          translateY(0)
          rotateX(0deg)
          rotateY(0deg)
          scale(1);
      }
      .card {
        border-radius: 28px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        padding: 24px 20px 22px;
        text-align: center;
        box-shadow:
          0 10px 24px rgba(0, 0, 0, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        position: relative;
        overflow: hidden;
      }
      .avatar {
        margin: 0 auto;
        width: 80px;
        height: 80px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 600;
        background: radial-gradient(circle at 20% 0%, #e5e7eb, transparent 55%),
          radial-gradient(circle at 80% 100%, #d1d5db, transparent 55%);
        color: rgba(0, 0, 0, 0.7);
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 22px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .subtitle {
        margin: 0;
        font-size: 13px;
        color: rgba(0, 0, 0, 0.6);
      }
      .meta {
        margin-top: 12px;
        font-size: 11px;
        color: rgba(0, 0, 0, 0.5);
      }
      .meta p {
        margin: 2px 0;
      }
      .actions {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .btn {
        border-radius: 999px;
        padding: 11px 16px;
        font-size: 14px;
        border: none;
        cursor: pointer;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          background-color 160ms ease,
          color 160ms ease;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }
      .btn-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
      }
      .btn-cta {
        color: var(--primary-foreground);
        background: linear-gradient(90deg, #111111, #e11d8f);
      }
      .btn-default {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .btn-secondary {
        background: transparent;
        color: var(--foreground);
        border: 1px solid var(--secondary-border);
      }
      .btn-outline {
        background: transparent;
        color: var(--foreground);
        border: 1px solid #e5e7eb;
      }
      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: rgba(0, 0, 0, 0.45);
      }
      @media (prefers-reduced-motion: reduce) {
        .card-spin {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
        .btn-lift:hover {
          transform: none !important;
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="card-wrapper">
      <div class="card card-spin" id="card">
        <div class="avatar">S</div>
        <h1>SONIA</h1>
        <p class="subtitle">Développeuse front-end — Smarter Logic Web</p>
        <div class="meta">
          <p>www.smarterlogicweb.com</p>
          <p>+33 7 44 40 79 73</p>
        </div>
        <div class="actions">
          <button class="btn btn-cta btn-lift">M'envoyer un message WhatsApp</button>
          <button class="btn btn-default btn-lift">Voir mon portfolio</button>
          <button class="btn btn-secondary btn-lift">Visiter mon site</button>
          <button class="btn btn-outline btn-lift">Enregistrer mes coordonnées</button>
        </div>
        <p class="hint">Prévisualisation statique Cosine — les boutons sont visuels uniquement.</p>
      </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        const card = document.getElementById("card");
        requestAnimationFrame(function () {
          card.classList.add("in-view");
        });
      });
    </script>
  </body>
</html>
